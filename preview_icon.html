<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skhayeduler App Icon Preview</title>
  <style>
    body {
      background: radial-gradient(circle at center, #1b2838, #0b1118);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 6px;
      color: #a6c8f5;
    }
    p {
      font-size: 14px;
      color: #8da4c4;
      margin-top: 0;
      margin-bottom: 28px;
    }
    .preview-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 36px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-wrapper {
      width: 280px;
      height: 280px;
      border-radius: 64px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .icon-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sizes-row {
      display: flex;
      gap: 24px;
      margin-top: 28px;
      align-items: center;
    }
    .size-item {
      text-align: center;
      font-size: 12px;
      color: #8da4c4;
    }
    .size-item img {
      border-radius: 22%;
      display: block;
      margin: 0 auto 8px auto;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div class="preview-card">
    <h1>Skhayeduler Official App Icon</h1>
    <p>12 • 3 • 6 • 9 Clock Dial | Hands at 2:13 | Kawaii Siamese Cat</p>
    
    <div class="icon-wrapper">
      <img src="./images/icon.png" alt="App Icon">
    </div>

    <div class="sizes-row">
      <div class="size-item">
        <img src="./images/icon.png" width="96" height="96" alt="96px">
        <span>96px</span>
      </div>
      <div class="size-item">
        <img src="./images/icon.png" width="64" height="64" alt="64px">
        <span>64px</span>
      </div>
      <div class="size-item">
        <img src="./images/icon.png" width="48" height="48" alt="48px">
        <span>48px</span>
      </div>
      <div class="size-item">
        <img src="./images/icon.png" width="32" height="32" alt="32px">
        <span>32px</span>
      </div>
    </div>
  </div>
</body>
</html>
