<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sunrise-sun" x1="256" y1="150" x2="256" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FDE047"/>
      <stop offset="75%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="sunrise-arrow" x1="256" y1="135" x2="256" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <clipPath id="sunrise-clip">
      <rect x="0" y="0" width="512" height="350"/>
    </clipPath>
  </defs>

  <!-- Sun Rays (Above Horizon) -->
  <g stroke="#FDE047" stroke-width="18" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="220" x2="256" y2="175"/>
    <line x1="321" y1="237" x2="344" y2="198"/>
    <line x1="191" y1="237" x2="168" y2="198"/>
    <line x1="369" y1="285" x2="408" y2="262"/>
    <line x1="143" y1="285" x2="104" y2="262"/>
  </g>

  <!-- Rising Sun (Clipped by Horizon) -->
  <g clip-path="url(#sunrise-clip)">
    <circle cx="256" cy="350" r="100" fill="url(#sunrise-sun)" stroke="#F59E0B" stroke-width="8"/>
  </g>

  <!-- Upward Rising Arrow -->
  <g stroke="url(#sunrise-arrow)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="256" y1="135" x2="256" y2="55"/>
    <polyline points="230,82 256,55 282,82"/>
  </g>

  <!-- Horizon Line -->
  <line x1="80" y1="350" x2="432" y2="350" stroke="#E2E8F0" stroke-width="22" stroke-linecap="round"/>

  <!-- Subtle Horizon Reflections -->
  <line x1="160" y1="382" x2="352" y2="382" stroke="#FDE047" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
  <line x1="200" y1="408" x2="312" y2="408" stroke="#F59E0B" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
</svg>
